        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: 
                radial-gradient(ellipse at 50% 0%, rgba(255, 215, 0, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 50, 100, 0.15) 0%, transparent 40%);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .shield-3d {
            width: 92px;
            height: 92px;
            position: relative;
            filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.55))
                    drop-shadow(0 8px 20px rgba(0,0,0,0.6));
            animation: float 4s ease-in-out infinite;
        }

        .shield-3d img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            transform: perspective(600px) rotateY(-8deg) rotateX(6deg);
            transition: transform 0.4s ease;
        }

        .shield-3d:hover img {
            transform: perspective(600px) rotateY(8deg) rotateX(-4deg) scale(1.05);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .brand-text h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            line-height: 1.2;
        }

        .brand-text .sub {
            font-size: 0.95rem;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 230, 118, 0.12);
            border: 1px solid rgba(0, 230, 118, 0.35);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--success);
        }

        .status-badge .dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.85); }
        }

        .custom-panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 28px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .custom-panel h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--gold);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .custom-panel h2::before {
            content: '';
            width: 4px;
            height: 16px;
            background: linear-gradient(180deg, var(--gold), var(--gold-dark));
            border-radius: 2px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        #customPhrase {
            flex: 1;
            min-width: 200px;
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            padding: 14px 18px;
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        #customPhrase:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.15);
        }

        #customPhrase::placeholder {
            color: #666;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .btn-copy {
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            color: #1a1200;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(255, 215, 0, 0.45);
        }

        .btn-add {
            background: linear-gradient(135deg, #00e676 0%, #00c853 100%);
            color: #003d1f;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.25);
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(0, 230, 118, 0.4);
        }

        .btn-clear {
            background: rgba(255,255,255,0.06);
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .btn-clear:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text);
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2.5px;
            color: var(--gold);
            margin-bottom: 16px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(255,215,0,0.4), transparent);
        }

        .phrases-grid {
            display: grid;
            gap: 12px;
        }

        .phrase-card {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .phrase-card.custom {
            border-color: rgba(0, 230, 118, 0.3);
        }

        .phrase-card.custom::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--success), transparent);
        }

        .phrase-card:hover {
            border-color: rgba(255, 215, 0, 0.45);
            background: rgba(18, 20, 30, 0.92);
            transform: translateX(4px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.35);
        }

        .phrase-card.editing {
            border-color: var(--edit);
            box-shadow: 0 0 0 2px rgba(64, 196, 255, 0.25);
        }

        .phrase-num {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gold);
            background: rgba(255, 215, 0, 0.1);
            min-width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .phrase-card.custom .phrase-num {
            color: var(--success);
            background: rgba(0, 230, 118, 0.12);
        }

        .phrase-text {
            flex: 1;
            font-size: 1.02rem;
            font-weight: 500;
            letter-spacing: 0.4px;
            line-height: 1.35;
            color: #f0f0f5;
            word-break: break-word;
        }

        .phrase-edit-input {
            flex: 1;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--edit);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.02rem;
            font-weight: 500;
            outline: none;
        }

        .phrase-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 9px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            background: rgba(255, 215, 0, 0.08);
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            transform: scale(1.08);
        }

        .icon-btn.copy:hover {
            background: rgba(255, 215, 0, 0.22);
            border-color: var(--gold);
        }

        .icon-btn.edit {
            border-color: rgba(64, 196, 255, 0.3);
            background: rgba(64, 196, 255, 0.1);
            color: var(--edit);
        }

        .icon-btn.edit:hover {
            background: rgba(64, 196, 255, 0.25);
            border-color: var(--edit);
        }

        .icon-btn.delete {
            border-color: rgba(255, 82, 82, 0.3);
            background: rgba(255, 82, 82, 0.1);
            color: var(--danger);
        }

        .icon-btn.delete:hover {
            background: rgba(255, 82, 82, 0.25);
            border-color: var(--danger);
        }

        .icon-btn.save {
            border-color: rgba(0, 230, 118, 0.4);
            background: rgba(0, 230, 118, 0.15);
            color: var(--success);
        }

        .icon-btn.save:hover {
            background: rgba(0, 230, 118, 0.3);
        }

        .icon-btn.cancel {
            border-color: rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            color: var(--text-muted);
        }

        .icon-btn.copied {
            background: rgba(0, 230, 118, 0.2);
            border-color: var(--success);
            color: var(--success);
        }

        .icon-btn svg {
            width: 17px;
            height: 17px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: linear-gradient(135deg, #1a1a22, #12121a);
            border: 1px solid rgba(0, 230, 118, 0.4);
            color: var(--success);
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 0.95rem;
            z-index: 100;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            border-color: rgba(255, 82, 82, 0.5);
            color: var(--danger);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        footer .ops {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }


        footer .signature {
            margin-top: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 1.5px;
            color: var(--gold);
            opacity: 0.85;
        }
        footer .ops span {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--gold);
            opacity: 0.7;
        }

        @media (max-width: 640px) {
            .brand-text h1 { font-size: 1.2rem; }
            .shield-3d { width: 72px; height: 72px; }
            .phrase-card { flex-wrap: wrap; gap: 12px; }
            .phrase-actions { width: 100%; justify-content: flex-end; }
            .input-row { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>

    <div class="toast" id="toast">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
        <span id="toastMsg">Copiado com sucesso!</span>
    </div>

    <script>
        const FIXED_PHRASES = [
            "EQUIPE PELO LOCAL UMA DAS PARTES ORIENTADA , OUTRA PARTE NÃO SE ENCONTRAVA NO LOCAL.",
            "PATRULHADO A VIA E IMEDIAÇÕES, NADA CONSTATADO, TESTEMUNHA ENCARREGADO.",
            "EQUIPE PELO LCL, NINGUEM SE APRESENTOU A EQUIPE, TENTADO VIA FONE PELO COPOM, SEM EXITO, SEM EXITO, AGUARDANDO REITERAÇÃO.",
            "EQUIPE PELO LCL, APENAS UMA DISCUSSÃO ENTRE PARTE (S), ORIENTADA (S).",
            "VERIFICANDO EQUIPES PARA O ATENDIMENTO.",
            "EQUIPES EM PRELEÇÃO, AGUARDANDO A DISPONIBILIDADE PARA O EMPENHO.",
            "DEMORA NO DESPACHO DA OCORRENCIA DEVIDO EQUIPES ESTAREM PRIORIZANDO OCORRENCIAS ENVOLVENDO VIDAS.",
            "OP SERVIR E PROTEGER",
            "OP IMPACTO"
        ];

        const STORAGE_KEY = 'copom_custom_phrases_v1';

        function loadCustom() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch {
                return [];
            }
        }

        function saveCustom(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMsg');
            msgEl.textContent = msg;
            toast.classList.toggle('error', isError);
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                if (btn) {
                    const original = btn.innerHTML;
                    btn.classList.add('copied');
                    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>`;
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.innerHTML = original;
                    }, 1400);
                }
                showToast('Copiado com sucesso!');
            }).catch(() => showToast('Erro ao copiar', true));
        }

        function renderFixed() {
            const grid = document.getElementById('phrasesGrid');
            grid.innerHTML = '';
            FIXED_PHRASES.forEach((text, i) => {
                const card = document.createElement('div');
                card.className = 'phrase-card';
                const safe = text.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
                card.innerHTML = `
                    <div class="phrase-num">${String(i + 1).padStart(2, '0')}</div>
                    <div class="phrase-text">${escapeHtml(text)}</div>
                    <div class="phrase-actions">
                        <button class="icon-btn copy" title="Copiar" onclick="event.stopPropagation(); copyText(\`${safe}\`, this)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                        </button>
                    </div>
                `;
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.icon-btn')) {
                        copyText(text, card.querySelector('.icon-btn'));
                    }
                });
                grid.appendChild(card);
            });
        }

        let customPhrases = loadCustom();
        let editingId = null;

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function renderCustom() {
            const grid = document.getElementById('customGrid');
            const title = document.getElementById('customSectionTitle');
            grid.innerHTML = '';

            if (customPhrases.length === 0) {
                title.style.display = 'none';
                return;
            }

            title.style.display = 'flex';

            customPhrases.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'phrase-card custom' + (editingId === item.id ? ' editing' : '');
                card.dataset.id = item.id;

                if (editingId === item.id) {
                    card.innerHTML = `
                        <div class="phrase-num">${String(idx + 1).padStart(2, '0')}</div>
                        <input class="phrase-edit-input" id="editInput-${item.id}" value="${escapeHtml(item.text)}">
                        <div class="phrase-actions">
                            <button class="icon-btn save" title="Salvar" onclick="saveEdit('${item.id}')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
                            </button>
                            <button class="icon-btn cancel" title="Cancelar" onclick="cancelEdit()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
                            </button>
                        </div>
                    `;
                    setTimeout(() => {
                        const inp = document.getElementById('editInput-' + item.id);
                        if (inp) { inp.focus(); inp.select(); }
                    }, 30);
                } else {
                    const safe = item.text.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
                    card.innerHTML = `
                        <div class="phrase-num">${String(idx + 1).padStart(2, '0')}</div>
                        <div class="phrase-text">${escapeHtml(item.text)}</div>
                        <div class="phrase-actions">
                            <button class="icon-btn edit" title="Editar" onclick="event.stopPropagation(); startEdit('${item.id}')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            </button>
                            <button class="icon-btn copy" title="Copiar" onclick="event.stopPropagation(); copyText(\`${safe}\`, this)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                            </button>
                            <button class="icon-btn delete" title="Excluir" onclick="event.stopPropagation(); deletePhrase('${item.id}')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M10 11v6M14 11v6"/></svg>
                            </button>
                        </div>
                    `;
                    card.addEventListener('click', (e) => {
                        if (!e.target.closest('.icon-btn')) {
                            copyText(item.text, card.querySelector('.icon-btn.copy'));
                        }
                    });
                }
                grid.appendChild(card);
            });
        }

        function addCustomPhrase() {
            const input = document.getElementById('customPhrase');
            const text = input.value.trim();
            if (!text) {
                input.focus();
                showToast('Digite uma frase primeiro', true);
                return;
            }
            const newItem = {
                id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
                text: text
            };
            customPhrases.unshift(newItem);
            saveCustom(customPhrases);
            input.value = '';
            editingId = null;
            renderCustom();
            showToast('Frase adicionada!');
        }

        function startEdit(id) {
            if (!confirm('Deseja EDITAR esta frase?')) {
                return;
            }
            editingId = id;
            renderCustom();
        }

        function cancelEdit() {
            editingId = null;
            renderCustom();
        }

        function saveEdit(id) {
            const inp = document.getElementById('editInput-' + id);
            if (!inp) return;
            const newText = inp.value.trim();
            if (!newText) {
                showToast('Frase não pode ficar vazia', true);
                return;
            }
            const item = customPhrases.find(p => p.id === id);
            if (item) {
                item.text = newText;
                saveCustom(customPhrases);
            }
            editingId = null;
            renderCustom();
            showToast('Frase atualizada!');
        }

        function deletePhrase(id) {
            if (!confirm('Tem certeza que deseja EXCLUIR esta frase?\n\nEsta ação não poderá ser desfeita.')) {
                return;
            }
            customPhrases = customPhrases.filter(p => p.id !== id);
            saveCustom(customPhrases);
            if (editingId === id) editingId = null;
            renderCustom();
            showToast('Frase excluída');
        }

        function copyCustom() {
            const input = document.getElementById('customPhrase');
            const text = input.value.trim();
            if (!text) {
                input.focus();
                showToast('Digite uma frase primeiro', true);
                return;
            }
            copyText(text);
        }

        document.getElementById('customPhrase').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addCustomPhrase();
        });

        renderFixed();
        renderCustom();
    </script>
</body>
</html>
