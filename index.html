<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COPOM-SP | Comando Operacional | Escudo do Raio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');

        :root {
            --gold: #FFD700;
            --gold-dark: #B8860B;
            --gold-glow: #FFEC8B;
            --dark: #0a0a0f;
            --darker: #050508;
            --panel: rgba(12, 14, 22, 0.88);
            --panel-border: rgba(255, 215, 0, 0.25);
            --text: #e8e8e8;
            --text-muted: #a0a0b0;
            --success: #00e676;
            --accent: #ffc107;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--darker);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background with COPOM image */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                linear-gradient(180deg, rgba(5,5,8,0.75) 0%, rgba(8,10,18,0.85) 40%, rgba(5,5,8,0.92) 100%),
                url('copom-bg.jpg') center center / cover no-repeat;
            filter: brightness(0.55) contrast(1.15) saturate(0.9);
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: 
                radial-gradient(ellipse at 50% 0%, rgba(255, 215, 0, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 50, 100, 0.15) 0%, transparent 40%);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .shield-3d {
            width: 92px;
            height: 92px;
            position: relative;
            filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.55))
                    drop-shadow(0 8px 20px rgba(0,0,0,0.6));
            animation: float 4s ease-in-out infinite;
        }

        .shield-3d img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            transform: perspective(600px) rotateY(-8deg) rotateX(6deg);
            transition: transform 0.4s ease;
        }

        .shield-3d:hover img {
            transform: perspective(600px) rotateY(8deg) rotateX(-4deg) scale(1.05);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .brand-text h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            line-height: 1.2;
        }

        .brand-text .sub {
            font-size: 0.95rem;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 230, 118, 0.12);
            border: 1px solid rgba(0, 230, 118, 0.35);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--success);
        }

        .status-badge .dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.85); }
        }

        /* Custom phrase input */
        .custom-panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 28px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .custom-panel h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--gold);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .custom-panel h2::before {
            content: '';
            width: 4px;
            height: 16px;
            background: linear-gradient(180deg, var(--gold), var(--gold-dark));
            border-radius: 2px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        #customPhrase {
            flex: 1;
            min-width: 220px;
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            padding: 14px 18px;
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        #customPhrase:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.15);
        }

        #customPhrase::placeholder {
            color: #666;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 22px;
            border: none;
            border-radius: 10px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
        }

        .btn-copy {
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            color: #1a1200;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(255, 215, 0, 0.45);
        }

        .btn-copy:active {
            transform: translateY(0);
        }

        .btn-clear {
            background: rgba(255,255,255,0.06);
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .btn-clear:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text);
        }

        /* Phrases section */
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2.5px;
            color: var(--gold);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(255,215,0,0.4), transparent);
        }

        .phrases-grid {
            display: grid;
            gap: 12px;
        }

        .phrase-card {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .phrase-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--gold), transparent);
            opacity: 0;
            transition: opacity 0.25s;
        }

        .phrase-card:hover {
            border-color: rgba(255, 215, 0, 0.45);
            background: rgba(18, 20, 30, 0.92);
            transform: translateX(4px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.35);
        }

        .phrase-card:hover::before {
            opacity: 1;
        }

        .phrase-num {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--gold);
            background: rgba(255, 215, 0, 0.1);
            min-width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .phrase-text {
            flex: 1;
            font-size: 1.02rem;
            font-weight: 500;
            letter-spacing: 0.4px;
            line-height: 1.35;
            color: #f0f0f5;
        }

        .phrase-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            background: rgba(255, 215, 0, 0.08);
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: var(--gold);
            transform: scale(1.08);
        }

        .icon-btn.copied {
            background: rgba(0, 230, 118, 0.2);
            border-color: var(--success);
            color: var(--success);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: linear-gradient(135deg, #1a1a22, #12121a);
            border: 1px solid rgba(0, 230, 118, 0.4);
            color: var(--success);
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 0.95rem;
            z-index: 100;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Footer */
        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        footer .ops {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        footer .ops span {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--gold);
            opacity: 0.7;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .brand-text h1 { font-size: 1.2rem; }
            .shield-3d { width: 72px; height: 72px; }
            .phrase-card { flex-direction: column; align-items: flex-start; gap: 12px; }
            .phrase-actions { align-self: flex-end; }
            .input-row { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    <div class="bg-overlay"></div>

    <div class="container">
        <header>
            <div class="brand">
                <div class="shield-3d">
                    <img src="raio-escudo.png" alt="Escudo do Raio - COPOM SP">
                </div>
                <div class="brand-text">
                    <h1>COPOM — SP</h1>
                    <div class="sub">Comando de Policiamento da Capital</div>
                </div>
            </div>
            <div class="status-badge">
                <span class="dot"></span>
                OPERACIONAL
            </div>
        </header>

        <!-- Custom Phrase -->
        <div class="custom-panel">
            <h2>NOVA FRASE PERSONALIZADA</h2>
            <div class="input-row">
                <input type="text" id="customPhrase" placeholder="Digite a frase operacional aqui..." autocomplete="off">
                <button class="btn btn-copy" onclick="copyCustom()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                    COPIAR
                </button>
                <button class="btn btn-clear" onclick="document.getElementById('customPhrase').value=''">LIMPAR</button>
            </div>
        </div>

        <!-- Ready Phrases -->
        <div class="section-title">FRASES OPERACIONAIS PRONTAS</div>
        <div class="phrases-grid" id="phrasesGrid">
            <!-- Generated by JS -->
        </div>

        <footer>
            <div class="ops">
                <span>OP SERVIR E PROTEGER</span>
                <span>✦</span>
                <span>OP IMPACTO</span>
            </div>
            <div>POLÍCIA MILITAR DO ESTADO DE SÃO PAULO — COPOM</div>
        </footer>
    </div>

    <div class="toast" id="toast">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
        <span>Copiado com sucesso!</span>
    </div>

    <script>
        const phrases = [
            "PATRULHADO A VIA E IMEDIAÇÕES, NADA CONSTATADO, TESTEMUNHA ENCARREGADO.",
            "EQUIPE PELO LCL, NINGUEM SE APRESENTOU A EQUIPE, TENTADO VIA FONE PELO COPOM, SEM EXITO, SINAIS SONOROS E LUMINISOS ACIONADOS, SEM EXITO, AGUARDANDO REITERAÇÃO.",
            "EQUIPE PELO LCL, APENAS UMA DISCUSSÃO ENTRE PARTE (S), ORIENTADA (S).",
            "VERIFICANDO EQUIPES PARA O ATENDIMENTO.",
            "EQUIPES EM PRELEÇÃO, AGUARDANDO A DISPONIBILIDADE PARA O EMPENHO.",
            "DEMORA NO DESPACHO DA OCORRENCIA DEVIDO EQUIPES ESTAREM PRIORIZANDO OCORRENCIAS ENVOLVENDO VIDAS.",
            "PRF CIENTE VIA WHATSAPP FUNCIONAL DA CABINE DE ESPECIALIDADES, NADA MAIS PARA A PM.",
            "OP SERVIR E PROTEGER",
            "OP IMPACTO"
        ];

        const grid = document.getElementById('phrasesGrid');

        phrases.forEach((text, i) => {
            const card = document.createElement('div');
            card.className = 'phrase-card';
            card.innerHTML = `
                <div class="phrase-num">${String(i + 1).padStart(2, '0')}</div>
                <div class="phrase-text">${text}</div>
                <div class="phrase-actions">
                    <button class="icon-btn" title="Copiar" onclick="copyPhrase(this, \`${text.replace(/`/g, '\\`')}\`)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                    </button>
                </div>
            `;
            card.addEventListener('click', (e) => {
                if (!e.target.closest('.icon-btn')) {
                    copyPhrase(card.querySelector('.icon-btn'), text);
                }
            });
            grid.appendChild(card);
        });

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
        }

        function copyPhrase(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                btn.classList.add('copied');
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>`;
                showToast();
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
                }, 1500);
            });
        }

        function copyCustom() {
            const input = document.getElementById('customPhrase');
            const text = input.value.trim();
            if (!text) {
                input.focus();
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                showToast();
            });
        }

        // Enter to copy custom
        document.getElementById('customPhrase').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') copyCustom();
        });
    </script>
</body>
</html>
